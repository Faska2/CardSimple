<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Digital Business Card - Professional Profile">
  <title>Digital Business Card</title>
  
  <!-- Modern Clean Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Ambient background glow for desktop display -->
  <div class="ambient-glow" aria-hidden="true"></div>

  <!-- Main Card Container -->
  <main class="card-viewport" id="card-container">
    <div class="card-scroll-wrapper">
      
      <!-- Profile Header / Hero Section -->
      <header class="profile-header">
        <div class="hero-image-container">
          <img id="profile-img" class="hero-image" src="assets/profile.jpg" alt="Profile Portrait" />
          <div class="hero-overlay-gradient"></div>
        </div>

        <div class="hero-text-content">
          <h1 id="profile-name" class="profile-name">
            <span class="first-name">JOHN</span>
            <span class="last-name">RICHARDS</span>
          </h1>
          <p id="profile-title" class="profile-title">Marketing Manager</p>
          
          <div id="company-wrapper" class="company-badge">
            <div class="logo-wrapper">
              <img id="company-logo" src="assets/logo.png" alt="Company Logo" class="company-logo" />
            </div>
            <span id="company-name" class="company-name">Teamwork.Co</span>
          </div>
        </div>
      </header>

      <!-- Contact Action Buttons Section (4 circular white buttons) -->
      <section class="contact-actions-section" aria-label="Quick Contact Actions">
        <div class="contact-buttons-row">
          
          <!-- Phone Call Button -->
          <a id="btn-phone" href="#" class="contact-circle-btn" aria-label="Phone Call" title="Call">
            <svg class="contact-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="2" width="14" height="20" rx="3" ry="3"></rect>
              <line x1="12" y1="18" x2="12.01" y2="18"></line>
            </svg>
          </a>

          <!-- Email Button -->
          <a id="btn-email" href="#" class="contact-circle-btn" aria-label="Send Email" title="Email">
            <svg class="contact-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <polyline points="3 7 12 13 21 7"></polyline>
            </svg>
          </a>

          <!-- SMS Message Button -->
          <a id="btn-sms" href="#" class="contact-circle-btn" aria-label="Send SMS" title="Message">
            <svg class="contact-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              <line x1="8" y1="10" x2="16" y2="10"></line>
              <line x1="8" y1="14" x2="13" y2="14"></line>
            </svg>
          </a>

          <!-- WhatsApp Button -->
          <a id="btn-whatsapp" href="#" target="_blank" rel="noopener noreferrer" class="contact-circle-btn" aria-label="Chat on WhatsApp" title="WhatsApp">
            <svg class="contact-btn-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91C2.13 13.66 2.59 15.36 3.45 16.86L2.05 22L7.3 20.62C8.75 21.41 10.38 21.83 12.04 21.83C17.5 21.83 21.95 17.38 21.95 11.92C21.95 9.27 20.92 6.78 19.05 4.91C17.18 3.03 14.69 2 12.04 2ZM12.05 20.15C10.56 20.15 9.11 19.76 7.85 19.01L7.55 18.83L4.43 19.65L5.26 16.61L5.06 16.29C4.24 14.99 3.81 13.47 3.81 11.91C3.81 7.37 7.5 3.69 12.05 3.69C14.25 3.69 16.31 4.55 17.87 6.11C19.42 7.67 20.28 9.73 20.28 11.93C20.28 16.47 16.59 20.15 12.05 20.15ZM16.56 14.36C16.31 14.24 15.09 13.64 14.86 13.56C14.64 13.47 14.47 13.43 14.31 13.68C14.14 13.92 13.67 14.48 13.53 14.64C13.38 14.8 13.24 14.82 12.99 14.7C12.74 14.58 11.94 14.31 11 13.47C10.26 12.82 9.77 12.01 9.62 11.76C9.48 11.52 9.6 11.38 9.73 11.26C9.84 11.15 9.98 10.97 10.1 10.83C10.23 10.69 10.27 10.59 10.35 10.43C10.43 10.26 10.39 10.12 10.33 10C10.27 9.88 9.77 8.65 9.57 8.15C9.37 7.66 9.17 7.73 9.02 7.72C8.88 7.71 8.71 7.71 8.55 7.71C8.38 7.71 8.12 7.77 7.89 8.02C7.67 8.27 7.04 8.86 7.04 10.06C7.04 11.27 7.92 12.43 8.04 12.59C8.16 12.76 9.76 15.22 12.22 16.29C12.81 16.54 13.26 16.69 13.62 16.81C14.21 17 14.74 16.97 15.17 16.91C15.65 16.84 16.64 16.31 16.85 15.72C17.05 15.14 17.05 14.64 16.99 14.54C16.93 14.44 16.81 14.48 16.56 14.36Z"/>
            </svg>
          </a>

        </div>
      </section>

      <!-- About Me Section -->
      <section id="about-card" class="about-me-card" aria-labelledby="about-me-title">
        <h2 id="about-me-title" class="about-me-title">About Me</h2>
        <p id="profile-bio" class="about-me-text">
          Hi, I am Flody, working as marketing manager at Teamwork.co
        </p>
        
        <!-- Address Badge inside About Card -->
        <div id="location-wrapper" class="location-badge" style="display: none;">
          <svg class="location-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <span id="profile-address" class="location-text"></span>
        </div>
      </section>

      <!-- Social Media Section (dynamically rendered if links exist) -->
      <section id="social-card" class="social-links-section" style="display: none;" aria-label="Social Profiles">
        <div id="social-links-container" class="social-links-grid"></div>
      </section>

      <!-- Safe spacer above bottom action bar -->
      <div class="bottom-bar-spacer" aria-hidden="true"></div>

    </div>

    <!-- Fixed Bottom Action Bar -->
    <nav class="bottom-action-bar-container" aria-label="Card Actions">
      <div class="bottom-action-bar">
        
        <!-- QR Code Button -->
        <button id="btn-qr" class="action-bar-btn circle-btn" aria-label="QR Code" title="QR Code">
          <svg class="bar-icon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M2 2h8v8H2V2zm2 2v4h4V4H4zm10-2h8v8h-8V2zm2 2v4h4V4h-4zM2 14h8v8H2v-8zm2 2v4h4v-4H4zm14 0h-4v2h2v4h-2v2h4v-2h2v-4h-2v-2zm-4-2h2v2h-2v-2zm6 0h2v4h-2v-4zm-2 6h4v2h-4v-2zM6 6h2v2H6V6zm10 0h2v2h-2V6zM6 18h2v2H6v-2z"/>
          </svg>
        </button>

        <!-- Share Profile Button -->
        <button id="btn-share" class="action-bar-btn circle-btn" aria-label="Share Profile" title="Share Profile">
          <svg class="bar-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
            <polyline points="16 6 12 2 8 6"></polyline>
            <line x1="12" y1="2" x2="12" y2="15"></line>
          </svg>
        </button>

        <!-- Add to Contact Button -->
        <button id="btn-add-contact" class="action-bar-btn pill-btn" aria-label="Add to Contact" title="Save Contact to Phone">
          <div class="pill-text-block">
            <span class="pill-line-1">Add to</span>
            <span class="pill-line-2">Contact</span>
          </div>
          <div class="pill-plus-badge">
            <svg class="pill-plus-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </div>
        </button>

      </div>
    </nav>
  </main>

  <!-- QR Code Modal Dialog -->
  <div id="qr-modal" class="modal-backdrop" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="qr-modal-title">
    <div class="modal-card">
      <button id="modal-close-btn" class="modal-close-trigger" aria-label="Close QR Code Modal">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <div class="modal-header">
        <span class="modal-tag">Digital Card</span>
        <h3 id="qr-modal-title" class="modal-title">Scan to Connect</h3>
        <p class="modal-desc">Scan with your phone camera to open and save this profile</p>
      </div>

      <div class="modal-qr-container">
        <div id="qr-target" class="qr-code-box"></div>
      </div>

      <div class="modal-user-info">
        <div id="modal-user-name" class="modal-user-name">John Richards</div>
        <div id="modal-user-sub" class="modal-user-sub">Marketing Manager • Teamwork.Co</div>
      </div>

      <div class="modal-button-group">
        <button id="modal-copy-link-btn" class="modal-action-btn secondary">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span>Copy Link</span>
        </button>
        <button id="modal-download-qr-btn" class="modal-action-btn primary">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>Save QR</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification System -->
  <div id="toast-notification" class="toast-popup" role="status" aria-live="polite">
    <div class="toast-icon-wrapper">
      <svg class="toast-check-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <span id="toast-text" class="toast-text">Message</span>
  </div>

  <!-- QR Code Generator Engine (offline pure vanilla JS) -->
  <script src="js/qrcode.min.js"></script>
  <!-- Application Logic & Profile Data -->
  <script src="js/app.js"></script>
</body>
</html>
